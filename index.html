<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聖路加ICU 年次レポート</title>
<style>
:root{--teal:#0084B5;--navy:#1D3348;--ink:#26333F;--sub:#61707E;--line:#E3EAF0}
*{box-sizing:border-box}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium",Meiryo,sans-serif;
  color:var(--ink);background:#F4F7FA;margin:0;line-height:1.9;
}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 60px}
.cover{
  background:linear-gradient(135deg,#1D3348 0%,#0084B5 100%);
  color:#fff;border-radius:20px;padding:38px 36px;margin-bottom:28px;
}
.cover .eyebrow{font-size:13px;letter-spacing:.16em;opacity:.9;margin-bottom:6px}
.cover h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.02em}
.cover .note{font-size:12.5px;opacity:.85;margin-top:14px}
.year{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.08em;margin:26px 4px 10px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:20px 24px;margin-bottom:14px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(22,34,46,.04);
}
.card .t{flex:1;min-width:220px}
.card .t b{display:block;color:var(--navy);font-size:16px}
.card .t span{font-size:13px;color:var(--sub)}
.btn{
  display:inline-block;font-size:13.5px;font-weight:700;text-decoration:none;
  border-radius:999px;padding:9px 20px;white-space:nowrap;
}
.btn.html{background:var(--teal);color:#fff}
.btn.pdf{background:#EEF2F6;color:#3A4B5C}
.foot{font-size:12px;color:var(--sub);margin-top:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="cover">
    <div class="eyebrow">聖路加国際病院 ICU</div>
    <h1>年次レポート</h1>
    <div class="note">このページはリンクを知っている方のみに共有しています（検索エンジンには載りません）。</div>
  </div>

  <div class="year">2025年度</div>

  <div class="card">
    <div class="t"><b>年次レポート 詳細版</b><span>全19章・図33点・表23点。経年推移とJIPAD全国比較つき</span></div>
    <a class="btn html" href="report2025.html">HTMLで開く</a>
    <a class="btn pdf" href="report2025.pdf">PDF</a>
  </div>

  <div class="card">
    <div class="t"><b>エグゼクティブレポート</b><span>管理職・多職種向けの要約版</span></div>
    <a class="btn html" href="executive2025.html">HTMLで開く</a>
    <a class="btn pdf" href="executive2025.pdf">PDF</a>
  </div>

  <div class="card">
    <div class="t"><b>栄養指標データ</b><span>管理栄養士向け。データ入力改善に伴い更新予定</span></div>
    <a class="btn html" href="nutrition2025.html">HTMLで開く</a>
    <a class="btn pdf" href="nutrition2025.pdf">PDF</a>
  </div>

  <div class="foot">聖路加国際病院 集中治療科</div>
</div>
</body>
</html>
